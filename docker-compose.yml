# PostgreSQL pro lokální vývoj (docker compose up -d). Přihlašovací údaje platí jen lokálně.
services:
  postgres:
    image: postgres:16-alpine
    container_name: zazitky-postgres
    environment:
      POSTGRES_DB: zazitky
      POSTGRES_USER: zazitky
      POSTGRES_PASSWORD: zazitky
    ports:
      - "5432:5432"
    volumes:
      - zazitky-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zazitky -d zazitky"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Celá aplikace z Dockerfile (profil prod + demo hra). Spouští se jen explicitně:
  #   docker compose --profile app up -d --build
  app:
    profiles: [app]
    build: .
    container_name: zazitky-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zazitky
      DB_USER: zazitky
      DB_PASSWORD: zazitky
      # V ostrém provozu jen db/migration; tady i demo hra s vývojovým kódem DEMO-KATA
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      # Administrace na http://localhost:8080/admin — jen pro lokální test
      ADMIN_PASSWORD: admin
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"

volumes:
  zazitky-pgdata:
