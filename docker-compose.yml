# PostgreSQL pro lokální vývoj. Přihlašovací údaje platí jen lokálně.
services:
  postgres:
    image: postgres:16-alpine
    container_name: zazitky-postgres
    environment:
      POSTGRES_DB: zazitky
      POSTGRES_USER: zazitky
      POSTGRES_PASSWORD: zazitky
    ports:
      - "5432:5432"
    volumes:
      - zazitky-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zazitky -d zazitky"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  zazitky-pgdata:
