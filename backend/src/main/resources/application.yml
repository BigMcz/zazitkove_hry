spring:
  application:
    name: zazitky
  autoconfigure:
    # Účty má jen administrace (AdminSecurityConfig), výchozí účet Spring Bootu s heslem v logu je zbytečný
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      # Grafika kartiček (docs/07-tisk-karticek.md)
      max-file-size: 20MB
      max-request-size: 21MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never
  servlet:
    session:
      cookie:
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Veřejná adresa aplikace pro odkazy v CSV s kódy (QR na kartičce); prázdné = adresa, ze které admin exportuje
  public-url: ""
  access-code:
    attempts-per-minute: 10          # na adresu klienta (IPv6 na celou síť /64)
    failed-attempts-per-minute: 300  # neznámé kódy ze všech adres dohromady, pak chvíli nikdo
  session:
    actions-per-minute: 30           # odpovědi, nápovědy a synchronizace na jednu hru
  admin:
    username: admin
    password: ""   # bez hesla je administrace vypnutá
    login-attempts-per-minute: 5
    login-failures-per-account: 10   # chybná hesla k jednomu účtu za 15 minut, pak je účet do té doby zamčený
