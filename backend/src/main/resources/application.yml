spring:
  application:
    name: zazitky
  autoconfigure:
    # Účty má jen administrace (AdminSecurityConfig), výchozí účet Spring Bootu s heslem v logu je zbytečný
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never
  servlet:
    session:
      cookie:
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Veřejná adresa aplikace pro odkazy v CSV s kódy (QR na kartičce); prázdné = adresa, ze které admin exportuje
  public-url: ""
  access-code:
    attempts-per-minute: 10
  admin:
    username: admin
    password: ""   # bez hesla je administrace vypnutá
    login-attempts-per-minute: 5
